<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Eema — Printable Card</title>
<style>
:root {
  --bg:      oklch(97% 0.012 80);
  --surface: oklch(99% 0.005 80);
  --fg:      oklch(20% 0.02 60);
  --muted:   oklch(48% 0.015 60);
  --border:  oklch(89% 0.012 80);
  --accent:  oklch(60% 0.22 28);

  --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:    ui-monospace, 'IBM Plex Mono', 'JetBrains Mono', Menlo, monospace;
}

@page {
  size: 8.5in 11in;
  margin: 0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 8.5in;
  height: 11in;
}

body {
  background: white;
  color: var(--fg);
  font-family: var(--font-body);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* ===== card occupies top half (8.5 x 5.5 in) ===== */
.card {
  width: 8.5in;
  height: 5.5in;
  background: var(--bg);
  display: grid;
  grid-template-columns: 1fr 1fr;
}

/* fold/cut line below the card */
.cut-line {
  position: absolute;
  top: 5.5in;
  left: 0;
  width: 8.5in;
  height: 0;
  border-top: 1px dashed oklch(80% 0.01 60);
}

.cut-label {
  position: absolute;
  top: calc(5.5in - 9px);
  right: 0.4in;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: oklch(70% 0.01 60);
  background: white;
  padding: 0 6px;
}

/* ===== left side: text + QR ===== */
.left {
  padding: 0.5in 0.45in;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 0.14in;
  border-right: 1px solid var(--border);
}

.kicker {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 12px;
}

.kicker::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.headline {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 0.46in;
  line-height: 0.94;
  letter-spacing: -0.025em;
  text-wrap: balance;
}

.headline .accent {
  color: var(--accent);
  font-style: italic;
}

.intro {
  font-family: var(--font-display);
  font-size: 12px;
  font-style: italic;
  line-height: 1.4;
  color: var(--fg);
  max-width: 26ch;
  margin-top: 0.06in;
}

.qr-block {
  align-self: center;
  justify-self: center;
  display: grid;
  justify-items: center;
  gap: 0.08in;
}

.qr-frame {
  background: white;
  padding: 0.1in;
  border: 1px solid var(--border);
}

.qr-frame img {
  display: block;
  width: 1.4in;
  height: 1.4in;
  image-rendering: pixelated;
}

.qr-caption {
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  line-height: 1.6;
}

.qr-caption .url {
  display: block;
  color: var(--fg);
  letter-spacing: 0.04em;
  text-transform: none;
  font-size: 10px;
  margin-top: 3px;
}

.signature {
  font-family: var(--font-display);
  font-size: 13px;
  font-style: italic;
  color: var(--muted);
  text-align: right;
}

/* ===== right side: photo full bleed ===== */
.right {
  position: relative;
  overflow: hidden;
}

.right img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-caption {
  position: absolute;
  inset: auto 0.25in 0.2in 0.25in;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: white;
  text-shadow: 0 1px 4px oklch(20% 0.02 60 / 0.7);
  z-index: 2;
}

@media screen {
  body {
    background: oklch(94% 0.006 80);
  }
  .card {
    box-shadow: 0 18px 48px -20px oklch(20% 0.02 60 / 0.35);
    margin: 24px auto 0;
  }
}
</style>
</head>
